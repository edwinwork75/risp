version: '3.8'
services:
  # ✅ PostgreSQL Database
  postgres:
    image: postgres:15
    container_name: nallahealth-postgres
    restart: always
    environment:
      POSTGRES_USER: nallahealthuser
      POSTGRES_PASSWORD: nallahealthpassword
      POSTGRES_DB: nallahealth_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nallahealthuser -d nallahealth_dev"]
      interval: 10s
      timeout: 5s
      retries: 5

